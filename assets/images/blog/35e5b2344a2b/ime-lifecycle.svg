  <text x="106.0" y="97.0" text-anchor="middle" dominant-baseline="central">onCreate()</text>
  <rect x="11" y="143" width="190" height="38" rx="2" fill="url(#g-gray)" stroke="#a9a9a9" filter="url(#sh)"/>
  <text x="106.0" y="162.0" text-anchor="middle" dominant-baseline="central">onCreateInputView()</text>
