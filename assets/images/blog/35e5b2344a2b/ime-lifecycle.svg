  <rect x="11" y="11" width="190" height="38" rx="2" fill="url(#g-blue)" stroke="#6c9fe0" filter="url(#sh)"/>
  <text x="106.0" y="24.75" text-anchor="middle" dominant-baseline="central">InputMethodService</text>
  <text x="106.0" y="35.25" text-anchor="middle" dominant-baseline="central">starts</text>
