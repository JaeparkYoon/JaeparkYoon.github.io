  <rect x="11" y="667" width="190" height="38" rx="2" fill="url(#g-gray)" stroke="#a9a9a9" filter="url(#sh)"/>
  <text x="106.0" y="686.0" text-anchor="middle" dominant-baseline="central">onFinishInput()</text>
  <rect x="11" y="731" width="190" height="38" rx="2" fill="url(#g-gray)" stroke="#a9a9a9" filter="url(#sh)"/>
  <text x="106.0" y="750.0" text-anchor="middle" dominant-baseline="central">onDestroy()</text>
  <rect x="11" y="795" width="190" height="38" rx="2" fill="url(#g-pink)" stroke="#e57fc6" filter="url(#sh)"/>
