  <text x="106.0" y="424.25" text-anchor="middle" dominant-baseline="central">getCurrentInputMethodSubtype()</text>
  <rect x="11" y="469" width="190" height="38" rx="2" fill="url(#g-green)" stroke="#8ab521" filter="url(#sh)"/>
  <text x="106.0" y="488.0" text-anchor="middle" dominant-baseline="central">Text input has started</text>
  <rect x="11" y="536" width="190" height="38" rx="2" fill="url(#g-gray)" stroke="#a9a9a9" filter="url(#sh)"/>
  <text x="106.0" y="555.0" text-anchor="middle" dominant-baseline="central">onCurrentInputMethodSubtypeChanged()</text>
  <rect x="11" y="600" width="190" height="38" rx="2" fill="url(#g-green)" stroke="#8ab521" filter="url(#sh)"/>
  <text x="106.0" y="613.75" text-anchor="middle" dominant-baseline="central">Detect the current input method subtype</text>
